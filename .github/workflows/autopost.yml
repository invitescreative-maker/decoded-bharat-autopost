name: autopost

on:
  schedule:
    # Slots (IST): 09:00 reel, 12:00 story, 13:00 carousel, 18:00 reel, 20:00 story  (cron is UTC = IST - 5:30)
    # first try ~3 min after each slot, second try ~38 min after
    - cron: "33 3,6,7,12,14 * * *"
    - cron: "8 4,7,8,13,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["jobs/**"]

# Only one run at a time -> no duplicate posts
concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # lets a long run start its successor

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Wait for slots, handle approvals and post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          python -u waiter.py
      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add -A jobs videos state.json
          git diff --cached --quiet || (git commit -m "autopost state" && git pull --rebase -q && git push)
